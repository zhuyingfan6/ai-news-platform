name: Daily Supply Chain News Brief

on:
  schedule:
    # Runs every day at 00:00 UTC (which is 8:00 AM Beijing time)
    - cron: '0 0 * * *'
  # Allows you to manually run the workflow from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run daily news job
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: python daily_news_job.py
    
    - name: Commit and push generated briefs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_briefs/
        git diff --staged --quiet || git commit -m "Auto-generate daily news brief for $(date +'%Y-%m-%d')"
        git push
